name: Context Tests

on:
  pull_request:
    paths:
      - 'context/**'
      - 'tests/**'
      - '.github/workflows/context-test.yml'
  push:
    branches: [main, master]
    paths:
      - 'context/**'
      - 'tests/**'

jobs:
  # Fast static analysis - runs on every PR
  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        working-directory: tests/context-unit-tests
        run: uv sync

      - name: Run format tests
        working-directory: tests/context-unit-tests
        run: uv run pytest test_doc_format.py -v

      - name: Run reference tests
        working-directory: tests/context-unit-tests
        run: uv run pytest test_references.py -v

  # Shell script tests
  shell:
    name: Shell Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Make coordinate.sh executable
        run: chmod +x context/agents/coordinate.sh

      - name: Run bats tests
        run: bats tests/context-unit-tests/coordinate.bats

  # LLM consistency check - runs on PRs but can be skipped
  llm-consistency:
    name: LLM Consistency Check
    runs-on: ubuntu-latest
    # Only run if ANTHROPIC_API_KEY is available
    if: ${{ vars.RUN_LLM_TESTS == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies (with LLM extras)
        working-directory: tests/context-unit-tests
        run: uv sync --extra llm

      - name: Run LLM consistency tests
        working-directory: tests/context-unit-tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run pytest test_llm_consistency.py -v
        continue-on-error: true  # Don't block PRs on LLM issues

  # Summary job for branch protection
  tests-passed:
    name: All Tests Passed
    needs: [lint, shell]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required tests passed"
